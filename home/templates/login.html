{% extends "base.html" %}
{% load static %}

{% block title %}
Login
{% endblock %}

{% block content %}

<!-- HIDE NAVBAR -->
<style>
    nav { display: none !important; }
</style>

<section class="relative min-h-[90vh] flex items-center justify-center px-4 overflow-hidden">

    <!-- BACKGROUND -->
    <div class="absolute inset-0 flex z-0 w-full h-full">
        <img src="{% static 'images/bgimg.jpg' %}" class="w-1/2 h-full object-cover scale-110">
        <img src="{% static 'images/backgroundnew.jpg' %}" class="w-1/2 h-full object-cover scale-110">
    </div>

    <div class="absolute inset-0 bg-gradient-to-r from-black via-purple-900/80 to-black z-10"></div>

    <!-- FORM -->
    <div class="relative z-20 w-full max-w-md 
                bg-white/10 backdrop-blur-xl 
                border border-white/20 
                rounded-2xl p-8 shadow-2xl
                transition duration-300 
                hover:shadow-[0_0_40px_rgba(255,115,0,0.35)]">

        <h2 class="text-3xl font-bold text-center text-white">
            Login to <span class="text-orange-500">Gamer's Island</span>
        </h2>

        <p class="text-center text-gray-300 text-sm mt-2">
            Welcome back! Enter your details
        </p>

        <form method="POST" class="mt-6 space-y-5">
            {% csrf_token %}

            <!-- Username -->
            <div>
                <label class="block text-sm text-gray-300 mb-1">Username</label>
                <input type="text" name="username"
                    class="w-full px-4 py-2 rounded-xl bg-gray-900/80 text-white 
                           border border-gray-700 outline-none 
                           focus:ring-2 focus:ring-orange-500"
                    placeholder="Enter username" required>
            </div>

            <!-- Password -->
            <div>
                <label class="block text-sm text-gray-300 mb-1">Password</label>
                <input type="password" name="password"
                    class="w-full px-4 py-2 rounded-xl bg-gray-900/80 text-white 
                           border border-gray-700 outline-none 
                           focus:ring-2 focus:ring-pink-500"
                    placeholder="Enter password" required>
            </div>

            <!-- Submit -->
            <button type="submit"
                class="w-full py-2.5 rounded-xl font-semibold text-white
                       bg-gradient-to-r from-orange-500 to-pink-500
                       hover:from-pink-500 hover:to-orange-500
                       transition duration-300 shadow-lg hover:shadow-orange-500/40">
                Login
            </button>
        </form>

        <!-- Extra -->
        <p class="text-sm text-center text-gray-400 mt-6">
            Don’t have an account?
            <a href="{% url 'register' %}" 
               class="text-orange-400 hover:underline font-medium">
                Register
            </a>
        </p>

    </div>

</section>

{% endblock %}
