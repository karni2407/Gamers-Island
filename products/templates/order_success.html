{% extends 'base.html' %}
{% load static %}

{% block content %}

<section class="py-24 bg-gradient-to-b from-gray-950 to-gray-900 min-h-screen">

    <div class="max-w-3xl mx-auto px-6 text-center">

        <div class="p-10 rounded-xl bg-white/10 border border-white/10 shadow-xl">

            <h1 class="text-5xl font-extrabold text-green-400 mb-6">
                Order Successful!
            </h1>

            <p class="text-gray-300 text-lg mb-4">
                Your order has been placed successfully.
            </p>

            <p class="text-gray-400 mb-2">
                Order ID: #{{ order.id }}
            </p>

            <p class="text-gray-400 mb-8">
                Your order is being processed and will be dispatched soon.
            </p>

            <a
                href="{% url 'products' %}"
                class="inline-block px-8 py-3 rounded-lg
                       bg-orange-500 hover:bg-orange-600
                       transition duration-300"
            >
                Continue Shopping
            </a>

        </div>

    </div>

</section>

{% endblock %}
